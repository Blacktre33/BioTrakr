name: Web CI

on:
  push:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # See api-ci.yml: switch to --frozen-lockfile once the lockfile is regenerated.
      - run: pnpm install --no-frozen-lockfile --filter @biotrakr/web...
      - run: pnpm --filter @biotrakr/web run typecheck
      - run: pnpm --filter @biotrakr/web test -- --ci
      # Fonts are bundled, so the production build needs no network.
      - run: pnpm --filter @biotrakr/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_TELEMETRY_DISABLED: 1

  packages:
    name: Shared package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --filter @biotrakr/utils...
      - run: pnpm --filter @biotrakr/utils test
