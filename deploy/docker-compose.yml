# BioTrakr on one hospital server. See docs/DEPLOY-ONPREM.md.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#
# Only the HTTPS proxy is reachable from the network; the database and the
# app containers talk on a private network.

name: biotrakr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:2.17.2-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: biotrakr
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: biotrakr
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biotrakr -d biotrakr"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: biotrakr-api:${BIOTRAKR_VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://biotrakr:${DB_PASSWORD}@db:5432/biotrakr
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env (at least 32 characters)}
      API_PORT: "3001"
      CLIENT_URL: https://${BIOTRAKR_HOST:?Set BIOTRAKR_HOST in deploy/.env}
      ALLOWED_ORIGINS: https://${BIOTRAKR_HOST}
      APP_URL: https://${BIOTRAKR_HOST}
      # One proxy (Caddy) in front: rate limits see the real client address.
      TRUST_PROXY: "1"
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_SECRET: ${NOTIFY_WEBHOOK_SECRET:-}
      NOTIFY_ESCALATE_MINUTES: ${NOTIFY_ESCALATE_MINUTES:-15,60}
      NOTIFY_ESCALATE_REPEAT_MINUTES: ${NOTIFY_ESCALATE_REPEAT_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-}
      NOTIFY_SMS_URL: ${NOTIFY_SMS_URL:-}
      NOTIFY_SMS_METHOD: ${NOTIFY_SMS_METHOD:-GET}
      NOTIFY_SMS_BODY: ${NOTIFY_SMS_BODY:-}
      NOTIFY_SMS_HEADERS: ${NOTIFY_SMS_HEADERS:-}
      NOTIFY_SMS_TEXT: ${NOTIFY_SMS_TEXT:-}
      NOTIFY_SMS_SUCCESS_MATCH: ${NOTIFY_SMS_SUCCESS_MATCH:-}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      # Written by the backup container; the API warns administrators when a
      # backup or its second copy fails or is overdue.
      BACKUP_STATUS_FILE: /backup-status/backup.json
      PM_LEAD_DAYS: ${PM_LEAD_DAYS:-14}
      DOWNTIME_LIMIT_CRITICAL_HOURS: ${DOWNTIME_LIMIT_CRITICAL_HOURS:-72}
      DOWNTIME_LIMIT_OTHER_HOURS: ${DOWNTIME_LIMIT_OTHER_HOURS:-168}
      UPTIME_TARGET_PERCENT: ${UPTIME_TARGET_PERCENT:-95}
      # Dates in work orders (e.g. "PM due 2026-10-14") use the hospital's time zone.
      TZ: ${TZ:-Asia/Kolkata}
      # No calls home (Prisma update checks); the server may have no internet.
      CHECKPOINT_DISABLE: "1"
    volumes:
      - backup-status:/backup-status:ro
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: biotrakr-web:${BIOTRAKR_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  proxy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    # BIND_IP limits which server address answers (Docker's published ports
    # bypass ufw; see the guide's security checklist).
    ports:
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
    environment:
      BIOTRAKR_HOST: ${BIOTRAKR_HOST}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
    logging: *logging

  backup:
    image: timescale/timescaledb:2.17.2-pg15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: biotrakr
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: biotrakr
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      # "yes" when BACKUP_COPY_DIR is set: backup.sh then copies each backup
      # to /backup-copy (below).
      BACKUP_COPY_CONFIGURED: ${BACKUP_COPY_DIR:+yes}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      # The second copy: BACKUP_COPY_DIR, a NAS share or USB disk mounted on
      # the server. Not set: an empty Docker volume stands in (no folder is
      # made on the server) and backup.sh skips the copy, as
      # BACKUP_COPY_CONFIGURED is empty. Default mount propagation on
      # purpose: "rslave" would show a share mounted after this container
      # started, but Docker refuses to start the container on hosts without
      # shared mounts, which would stop the local backups too. A share that
      # was not mounted in time is caught by the marker file check instead.
      - ${BACKUP_COPY_DIR:-backup-copy-unset}:/backup-copy
      # Read by the API (see BACKUP_STATUS_FILE).
      - backup-status:/status
      # To back up the HTTPS certificate authority Caddy creates (CADDY_TLS=internal).
      - caddy-data:/caddy:ro
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    logging: *logging

volumes:
  db-data:
  caddy-data:
  backup-status:
  # Stands in for BACKUP_COPY_DIR when it is not set (always empty).
  backup-copy-unset:
